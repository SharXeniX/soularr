[Lidarr]
api_key = yourlidarrapikeygoeshere
host_url = http://lidarr:8686
download_dir = /data/slskd_downloads
disable_sync = False

[Slskd]
api_key = yourslskdapikeygoeshere
host_url = http://slskd:5030
url_base = /
download_dir = /downloads
delete_searches = False
stalled_timeout = 3600
remote_queue_timeout = 300

[Release Settings]
use_selected_lidarr_release = False
use_most_common_tracknum = True
allow_multi_disc = True
accepted_countries = Europe,Japan,United Kingdom,United States,[Worldwide],Australia,Canada
skip_region_check = False
accepted_formats = CD,Digital Media,Vinyl

[Search Settings]
search_timeout = 5000
maximum_peer_queue = 50
minimum_peer_upload_speed = 0
minimum_filename_match_ratio = 0.8
minimum_search_interval = 5
allowed_filetypes = flac 24/192,flac 16/44.1,flac,mp3 320,mp3
ignored_users = User1,User2,Fred,Bob
album_prepend_artist = False
search_type = incrementing_page
number_of_albums_to_grab = 10
title_blacklist = BlacklistWord1,blacklistword2
search_blacklist = WordToStripFromSearch1,WordToStripFromSearch2
search_source = missing
failed_import_denylist = True

[Download Settings]
download_filtering = True
use_extension_whitelist = False
extensions_whitelist = lrc,nfo,txt

[Orphan Settings]
# Recovery scan for /downloads subfolders that aren't tracked nor previously
# resolved. Soularr reads ID3 tags, fuzzy-matches against Lidarr's library, and
# triggers DownloadedAlbumsScan so Lidarr can import them naturally.
enabled = True
# Minimum SequenceMatcher ratio against Lidarr's artistName for a match to count.
artist_name_match_ratio = 0.85
# Minimum SequenceMatcher ratio against Lidarr's album title for a match to count.
album_name_match_ratio = 0.85
# Seconds to wait for the Lidarr DownloadedAlbumsScan command to finish per folder.
lidarr_command_timeout = 60

[Adopt Settings]
# Reconcile state.albums with slskd's active downloads at the start of every
# cycle: drop entries whose slskd transfers were deleted, and adopt any active
# download that matches a wanted album we don't already track. Prevents
# duplicate grabs when the user manually picks a different uploader in the
# slskd UI.
enabled = True
# Minimum SequenceMatcher ratio between the slskd directory path (with artist
# segments) and "<artist> <album>" for adoption to fire.
fuzzy_threshold = 0.7

[Prepare Settings]
# Pre-import preparation: rewrite weak tags and optionally rename files in the
# download folder before triggering Lidarr ManualImport. Reduces 'Album match
# is not close enough' rejections and makes the on-disk layout match Lidarr's
# naming pattern so the import is essentially a no-op move.
enabled = True
# Conservatively rewrite albumartist / album / year on each file (only when
# the existing tag is missing or differs from Lidarr's canonical value).
# Title and track number are NEVER overwritten — track number is filled in
# only when the file has none and we can derive it from the filename.
rewrite_tags = True
# When the file has no tracknumber tag, parse the leading digits of the
# filename (e.g. '01 - Foo.flac' -> 1). Requires rewrite_tags = True to
# actually persist the inferred value.
infer_track_number_from_filename = True
# Lidarr-style rename pattern. Empty string disables renaming (tags are still
# rewritten if rewrite_tags is True). Use '/' to create subfolders. The
# extension is appended automatically.
#
# Supported tokens (case-sensitive, exact spelling):
#   {Album Title}              album title (with original chars)
#   {Album CleanTitle}         album title sanitized for filesystem
#   {Release Year}             4-digit year from Lidarr's releaseDate
#   {Artist Name}              artist name (with original chars)
#   {Artist CleanName}         artist name sanitized for filesystem
#   {Album Artist Name}        same as Artist Name (Lidarr stores one artist per album)
#   {Album Artist CleanName}   sanitized variant
#   {Track Title}              track title (with original chars)
#   {Track CleanTitle}         track title sanitized for filesystem
#   {track}, {track:00}, {track:000}   track number, optional zero-pad width
#   {Disc},  {Disc:00}                 medium / disc number
#
# Default below mirrors the Lidarr 'Standard Track Format' people typically use.
rename_pattern = {Album Title} ({Release Year})/{Artist Name} - {Album Title} - {track:00} - {Track Title}

[Logging]
level = INFO
# https://docs.python.org/3/library/logging.html#logrecord-attributes
format = [%(levelname)s|%(module)s|L%(lineno)d] %(asctime)s: %(message)s
# https://docs.python.org/3/library/time.html#time.strftime
datefmt = %Y-%m-%dT%H:%M:%S%z
# Enable logging to a file in addition to stdout
log_to_file = True
# Log filename (resolved relative to the data/var directory)
log_file = soularr.log
# Maximum log file size in bytes before rotation (default: 1MB)
max_bytes = 1048576
# Number of rotated log files to keep
backup_count = 3
